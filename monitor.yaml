name: HKJC odds monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub uses UTC. Every two hours; GitHub may delay or occasionally skip runs.
    - cron: '17 */2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hkjc-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout data and code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect HKJC odds
        env:
          TIPSME_API_KEY: ${{ secrets.TIPSME_API_KEY }}
        run: python monitor.py
      - name: Commit updated public history to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update sampled public HKJC odds history'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
