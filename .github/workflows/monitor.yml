name: HKJC GraphQL odds monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *' # every 2 hours, UTC; runs may be delayed/skipped

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hkjc-graphql-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public HKJC GraphQL odds
        run: python monitor.py
      - name: Commit public odds history and legacy archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/
          if ! git diff --cached --quiet; then
            git commit -m 'Update HKJC GraphQL odds history'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish website
        uses: actions/deploy-pages@v4
