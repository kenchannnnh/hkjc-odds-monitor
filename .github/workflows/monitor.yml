name: HKJC GraphQL odds monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *' # every 2 hours, UTC; runs may be delayed/skipped

concurrency:
  group: hkjc-graphql-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public HKJC GraphQL odds
        run: python monitor.py
      - name: Commit public odds history and legacy archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/
          if ! git diff --cached --quiet; then
            git commit -m 'Update HKJC GraphQL odds history'
            git push
          fi
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          retention-days: 7

  publish:
    needs: monitor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..6}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '[.artifacts[] | select(.expired == false)] | length') && [ "$count" -gt 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Pages artifact is not visible yet (attempt $attempt of 6)."
              sleep 5
            fi
          done
          echo "::error::Pages artifact still unavailable. Re-run the publish job to reuse the collected data."
          exit 1
      - name: Publish website
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying publication
        if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - name: Retry website publication
        if: steps.deploy.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v4
